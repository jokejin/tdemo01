sonar.projectKey=jokejin_tdemo01
sonar.organization=jokejin

# 1. Point directly to the docs folder as the source root
sonar.sources=docs

# 2. Force SonarQube to include all files in docs as source code
sonar.sources.inclusions=docs/**/*

# 3. Explicitly empty out test parameters to stop the automatic "docs=test" rule
sonar.tests=
sonar.test.inclusions=

sonar.sourceEncoding=UTF-8
